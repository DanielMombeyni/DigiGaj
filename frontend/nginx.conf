server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Product documents and discovery must reach Django before the SPA fallback.
  location ~ ^/(products/[^/]+/?|sitemap\.xml|sitemap-products\.xml|robots\.txt)$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
